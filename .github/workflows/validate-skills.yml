name: Validate skills

on:
  push:
    paths:
      - 'skills/**'
      - 'packages/harness/**'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'packages/harness/**'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: No legacy _shared paths
        run: |
          set -euo pipefail
          if rg -q 'skills/_shared|_shared/references' skills/; then
            echo 'ERROR: Found legacy _shared path references under skills/'
            rg -n 'skills/_shared|_shared/references' skills/
            exit 1
          fi
          echo 'OK: no legacy _shared paths'

      - name: No retired product_root path variables
        run: |
          set -euo pipefail
          # Fail on retired path tokens. MIGRATION changelog may mention old names.
          if rg -n 'product_root|harness-discovery|specs_root|context_root|harness_root|product_slug|\{product-slug\}' \
            skills/ packages/harness/templates/ packages/harness/docs/ packages/harness/src/ \
            --glob '!**/node_modules/**' \
            --glob '!skills/_meta/MIGRATION.md'; then
            echo 'ERROR: Found retired product_root / harness-discovery path tokens'
            exit 1
          fi
          echo 'OK: no retired product_root path variables'

      - name: No forced tool-Read of AGENTS.md
        run: |
          set -euo pipefail
          # AGENTS.md is host-injected; skills must not instruct a tool Read of it.
          if rg -n 'Read this file \(`AGENTS\.md`\)|Read `AGENTS\.md` in full|Read `AGENTS\.md` first|Read AGENTS\.md at|Begin Session boot.*Read `AGENTS' \
            skills/ packages/harness/templates/ packages/harness/src/ \
            --glob '!**/node_modules/**' \
            --glob '!skills/_meta/MIGRATION.md'; then
            echo 'ERROR: Found instructions that force a tool-Read of AGENTS.md'
            exit 1
          fi
          echo 'OK: no forced AGENTS.md tool-Read instructions'

      - name: No legacy harness-init package references
        run: |
          set -euo pipefail
          if rg -q '@nextstage-brasil/harness-init|packages/harness-init' --glob '!packages/harness/node_modules/**' .; then
            echo 'ERROR: Found legacy harness-init package references'
            rg -n '@nextstage-brasil/harness-init|packages/harness-init' --glob '!packages/harness/node_modules/**' .
            exit 1
          fi
          echo 'OK: no legacy harness-init package references'

      - name: ns-harness skill exists
        run: |
          set -euo pipefail
          if [ ! -f skills/ns-harness/SKILL.md ]; then
            echo 'ERROR: skills/ns-harness/SKILL.md is missing'
            exit 1
          fi
          echo 'OK: ns-harness/SKILL.md present'

      - name: Harness refs require depends in frontmatter
        run: |
          set -euo pipefail
          failed=0
          for skill_md in skills/*/SKILL.md skills/*/*/SKILL.md; do
            [ -f "$skill_md" ] || continue
            body=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm>=2{print}' "$skill_md")
            if echo "$body" | rg -q '\.\./.*ns-harness/'; then
              frontmatter=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm==1{print}' "$skill_md")
              if ! echo "$frontmatter" | rg -q '^depends:' || ! echo "$frontmatter" | rg -q 'ns-harness'; then
                echo "ERROR: $skill_md references ../ns-harness/ but frontmatter lacks depends: ns-harness"
                failed=1
              fi
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo 'OK: all harness references declare depends'

      - name: Catalog sync with skills
        run: node packages/harness/scripts/validate-catalog.js

      - name: Skills CLI can parse all SKILL.md frontmatter
        run: |
          set -euo pipefail
          out=$(npx --yes skills add . --list --full-depth 2>&1)
          if echo "$out" | rg -q 'Skipped .*YAML parse error'; then
            echo 'ERROR: skills CLI skipped skill(s) due to invalid YAML frontmatter'
            echo "$out" | rg 'Skipped .*YAML parse error' || true
            exit 1
          fi
          echo 'OK: no YAML parse skips from skills CLI'

      - name: Harness CLI smoke test
        working-directory: packages/harness
        run: |
          npm install
          npm test
