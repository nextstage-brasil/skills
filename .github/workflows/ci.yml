name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install harness dependencies
        working-directory: packages/harness
        run: npm install
      - name: Harness tests
        working-directory: packages/harness
        run: npm test
      - name: Harness list
        run: node packages/harness/bin/cli.js list --presets

  validate-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate depends graph
        run: node scripts/validate-depends.js
      - name: Validate catalog
        run: node packages/harness/scripts/validate-catalog.js

  skills-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill manifests
        run: node scripts/validate-manifests.js
